<!DOCTYPE html>
<html>
<head>
    <title>Bouncing Ball</title>

    <style>
        body {
            margin: 0;
            background: #75d4df;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial;
        }

        .card {
            width: 300px;
            height: 530px;
            background: white;
            border-radius: 25px;
            text-align: center;
            padding-top: 30px;
            box-sizing: border-box;
        }

        h1 {
            font-size: 30px;
            margin: 0 ;
        }

        p {
            color: gray;
            margin: 0;
        }

        .ball {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: radial-gradient(
                circle at 30% 30%,
                white,
                #d8d58b,
                #8c8945
            );

            margin: 130px auto;

            animation: bounce 1s infinite alternate ease-in-out;
        }
        .shadow{
            width: 80px;
            height: 20px;
            background: radial-gradient(
                ellipse at center,
                rgba(218, 62, 62, 0.5),
                rgba(0, 0, 0, 0)
            );
            border-radius: 50%;
             margin: -10px auto; 
            animation: shadow 1s infinite alternate ease-in-out;


        }
        @keyframes bounce {
            0% {
                transform: translateY(0);
            }
            100% {
                transform: translateY(-100px);
            }
        }
        @keyframes shadow {
            0% {
                transform: scaleX(1);
            }
            100% {
                transform: scaleX(0.4);
            }
        }

       
    </style>
</head>

<body>

    <div class="card">

        <h1>Bouncing Ball</h1>

        <p>Level 3 - Movement Project</p>

        
        <div class="ball"></div>
        <div class="shadow"></div>

    </div>

</body>
</html>
